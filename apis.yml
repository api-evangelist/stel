name: Stel
description: >-
  Stel Life provides cellular-connected remote patient monitoring (RPM)
  infrastructure for healthcare. Its cellular-enabled vitals hubs and connected
  medical devices — blood pressure monitors, pulse oximeters, glucometers,
  thermometers, and scales — let patients transmit vital-sign readings to
  electronic health record (EHR) systems without WiFi, broadband, a smartphone,
  or app setup, targeting elderly, low-income, rural, and low-tech-literacy
  populations. Health systems and digital health organizations use Stel across
  the care continuum, from wellness and chronic-care management to
  hospital-at-home. Stel is backed by Bloomberg Beta.
